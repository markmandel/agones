{{/* schema defining a wasm function to run as an extension plugin to Agones */}}

{{- define "wasm.extension" }}
wasm:
  type: object
  nullable: true
  required:
    - from
  properties:
    function: # The exported function to call in the wasm module, defaults to 'scale'
      type: string
      default: {{ .defaultFunction }}
    config: # Config values to pass to the wasm program on startup
      type: object
      additionalProperties:
        type: string
    from:
      type: object
      required:
        - url
      properties:
        url:
          {{- include "url.configuration" . | indent 10 }}
    hash: # optional sha256 hash to match against wasm file (it's optional, but recommended)
      type: string
      pattern: "^[a-fA-F0-9]{64}$"
{{- end}}