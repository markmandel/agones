#
# Example GameServerAllocation that uses a Wasm plugin to allocate a single session on a multi-session
# GameServer. Use fleet.yaml in this directory as the Fleet configuration.
#
apiVersion: allocation.agones.dev/v1
kind: GameServerAllocation
spec:
  scheduling: Packed
  priorities:
    - type: List
      key: freeSessions
      order: Descending  # Prefer GameServers with the fewest free sessions, to pack sessions together.
  selectors:
    # First look for an already Allocated GameServer that still has at least one free session.
    - gameServerState: Allocated
      matchLabels:
        agones.dev/fleet: simple-game-server
      lists:
        freeSessions:
          maxAvailable: 2  # With a capacity of 3, at least one session must be left in the List.
    # Otherwise, allocate a Ready GameServer, which has all of its sessions free.
    - gameServerState: Ready
      matchLabels:
        agones.dev/fleet: simple-game-server
  # [Stage:Alpha]
  # [FeatureFlag:WasmAllocation]
  # Wasm plugin to run against the selected GameServer as part of allocation.
  # The plugin function is passed the GameServer as JSON, and returns the GameServer as JSON with
  # any changes that should be applied as part of the allocation.
  wasm:
    # The exported function to call in the wasm module, defaults to 'allocate'
    function: 'allocate'
    # Config values to pass to the wasm program
    config:
      # The List to take a free session from.
      list: freeSessions
    from:
      url:
        # Direct URL to the wasm plugin
        url: "https://github.com/agones-dev/agones/raw/refs/heads/main/examples/allocation-wasm/plugin.wasm"
