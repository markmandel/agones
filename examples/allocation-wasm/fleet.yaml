---
#
# Example multi-session Fleet for use with gameserverallocation.yaml.
#
# Each GameServer hosts up to three sessions, and each session has its own port, named after the session.
# The `freeSessions` List tracks which sessions are not in use, so a session can be matched to its port
# by name once it has been allocated.
#
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: simple-game-server
spec:
  replicas: 2
  template:
    spec:
      # One port per session. The port name matches the session name in the `freeSessions` List.
      ports:
        - name: session-1
          containerPort: 7654
        - name: session-2
          containerPort: 7655
        - name: session-3
          containerPort: 7656
      lists:
        # Sessions that are free to be allocated. The allocation Wasm plugin removes a session from this List
        # when it is allocated, and the game server adds it back when the session ends.
        freeSessions:
          capacity: 3
          values:
            - session-1
            - session-2
            - session-3
      template:
        spec:
          containers:
            - name: simple-game-server
              image: us-docker.pkg.dev/agones-images/examples/simple-game-server:0.45
              resources:
                requests:
                  memory: 64Mi
                  cpu: 20m
                limits:
                  memory: 64Mi
                  cpu: 20m
