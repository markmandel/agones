# The migration-test workload as a Kata pod: UDP :7777 replies with in-memory state.
# Image: `CGO_ENABLED=0 go build -o <dir>/init .`, a FROM scratch Dockerfile with /init as the
# entrypoint, `docker build -t ch-mig-guest:0.1 <dir>`, `minikube -p migration image load ch-mig-guest:0.1`.
apiVersion: v1
kind: Pod
metadata:
  name: kata-mig
spec:
  runtimeClassName: kata-clh
  nodeName: migration
  containers:
    - name: guest
      image: ch-mig-guest:0.1
      imagePullPolicy: Never
