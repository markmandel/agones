# Like receive-pods.yaml, with the Xonotic example server as the workload: a real game server
# (700Mi request) with 4 bots (+bot_number 4 +bot_join_empty 1) playing a deathmatch with nobody connected. It
# runs server_linux.sh directly, bypassing the Agones SDK wrapper, so no Agones is needed.
# Use with: PODS=xonotic-pods.yaml KIND=xonotic QKIND=xonotic-status receive-run.sh
apiVersion: v1
kind: Pod
metadata:
  name: mig-src
spec:
  runtimeClassName: kata-clh-mig
  nodeName: migration
  containers:
    - name: xonotic
      image: us-docker.pkg.dev/agones-images/examples/xonotic-example:2.8
      command: ["/home/xonotic/Xonotic/server_linux.sh"]
      args: ["+bot_number", "4", "+bot_join_empty", "1"]  # bots play with nobody connected
      resources:
        requests:
          memory: 700Mi
          cpu: 200m
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-dst
  annotations:
    migrate.agones.dev/receive: unix:/run/vc/migrate-in.sock
    migrate.agones.dev/source-sandbox: SOURCE_SANDBOX
    migrate.agones.dev/containers: xonotic=SOURCE_GUEST_ID
spec:
  runtimeClassName: kata-clh-mig
  nodeName: migration-m02
  containers:
    - name: xonotic
      image: us-docker.pkg.dev/agones-images/examples/xonotic-example:2.8
      command: ["/home/xonotic/Xonotic/server_linux.sh"]
      args: ["+bot_number", "4", "+bot_join_empty", "1"]  # bots play with nobody connected
      resources:
        requests:
          memory: 700Mi
          cpu: 200m
