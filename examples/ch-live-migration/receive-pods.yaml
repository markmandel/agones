# Pod 1 -> pod 2 with the receive-mode shim (runtime class kata-clh-mig, both pods).
# mig-src runs normally on node 1. mig-dst is the placeholder on node 2: a copy of mig-src's
# spec plus annotations naming the source sandbox and its container IDs by container name.
# Fill SOURCE_SANDBOX and SOURCE_GUEST_ID (see the plan) before applying mig-dst.
apiVersion: v1
kind: Pod
metadata:
  name: mig-src
spec:
  runtimeClassName: kata-clh-mig
  nodeName: migration
  containers:
    - name: guest
      image: ch-mig-guest:0.1
      imagePullPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-dst
  annotations:
    migrate.agones.dev/receive: unix:/run/vc/migrate-in.sock
    migrate.agones.dev/source-sandbox: SOURCE_SANDBOX
    migrate.agones.dev/containers: guest=SOURCE_GUEST_ID
spec:
  runtimeClassName: kata-clh-mig
  nodeName: migration-m02
  containers:
    - name: guest
      image: ch-mig-guest:0.1
      imagePullPolicy: Never
